<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataTable with Search, Filter, Sort, and Export</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.1/css/buttons.dataTables.min.css">
</head>
<body>
<div class="container my-4">
    <h2 class="text-center">DataTable with Multi-Filter, Sort, and Export</h2>
    
    <!-- Multi-Filter Inputs -->
    <div class="row my-3">
        <div class="col-md-3">
            <input type="text" id="nameFilter" class="form-control" placeholder="Filter by Name">
        </div>
        <div class="col-md-3">
            <input type="text" id="emailFilter" class="form-control" placeholder="Filter by Email">
        </div>
        <div class="col-md-3">
            <input type="text" id="roleFilter" class="form-control" placeholder="Filter by Role">
        </div>
    </div>
    
    <!-- DataTable -->
    <table id="example" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Joined Date</th>
            </tr>
        </thead>
        <tbody>
            <!-- Example data, replace with dynamic content as needed -->
            <tr><td>John Doe</td><td>john@example.com</td><td>Admin</td><td>2023-01-01</td></tr>
            <tr><td>Jane Smith</td><td>jane@example.com</td><td>User</td><td>2023-02-15</td></tr>
            <tr><td>Mike Brown</td><td>mike@example.com</td><td>Moderator</td><td>2023-03-30</td></tr>
            <!-- Add more rows as needed -->
        </tbody>
    </table>
</div>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.1/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {
    // Initialize DataTable with Buttons for CSV export
    var table = $('#example').DataTable({
        dom: 'Bfrtip',
        buttons: [
            {
                extend: 'csvHtml5',
                text: 'Export CSV',
                title: 'Data Export'
            }
        ]
    });

    // Multi-Filter Search
    $('#nameFilter').on('keyup', function() {
        table.columns(0).search(this.value).draw();
    });
    
    $('#emailFilter').on('keyup', function() {
        table.columns(1).search(this.value).draw();
    });
    
    $('#roleFilter').on('keyup', function() {
        table.columns(2).search(this.value).draw();
    });
});
</script>
</body>
</html>
